name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # プラグインの中身が正本 (packages/cli・skills) どおりか + CLI の単体テスト
      - run: npm run check
      # npm に載る中身 (公開はしない)
      - run: npm pack --dry-run
        working-directory: packages/cli
      # `claude plugin validate --strict` は Claude Code が要るので手元で (`npm run validate`)
